<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 10</title>
</head>
<body>
    <script>
        // Función principal
        const main = () => {
            const cantidad = parseInt(prompt("¿Cuántos números querés ingresar?"));
            const numeros = [];

            for (let i = 0; i < cantidad; i++) { 
                const num = parseInt(prompt(`Ingresá el número ${i + 1}:`));
                numeros.push(num); 
            }

            // Calcular promedio  
            const suma = numeros.reduce((acc, num) => acc + num, 0); 
            const promedio = suma / cantidad;

            // Mostrar resultados (cambio console.log por document.write) 
            document.write(`<p>Números ingresados: ${numeros.join(", ")}</p>`); 
            document.write(`<p>Promedio: ${promedio}</p>`);
        };

        // Ejecutar
        main();

    </script>
    
</body>
</html>
