<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Ejercicio 18</title>
  </head>
  <body>
    <script>
      const calcularMayor = (numero1, numero2) => {
        if (numero1 > numero2) {
          document.write(`El número mayor es: ${numero1}`);
        } else if (numero2 > numero1) {
          document.write(`El número mayor es: ${numero2}`);
        } else {
          document.write(`Ambos números son iguales: ${numero1}`);
        }
      };

      const main = () => {
        const numero1 = parseFloat(prompt("Ingresá el primer número:"));
        const numero2 = parseFloat(prompt("Ingresá el segundo número:"));

        calcularMayor(numero1, numero2);
      };

      main();
    </script>
  </body>
</html>
